# One-click deploy of the GenBid Pro API on Render (https://render.com/deploy).
services:
  - type: web
    name: genbid-pro-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    # Free plan: 512 MB RAM and the service sleeps after 15 idle minutes (first request then takes ~1 min).
    # The portal currently answers plain requests, so the memory-hungry browser fallback stays off here.
    # Switch to plan: starter and MUASAMCONG_MODE=auto if muasamcong starts enforcing reCAPTCHA.
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUASAMCONG_MODE
        value: direct
