name: Supplier publish

# Posts the supplier records (suppliers/cn/*.json) to the web as supplier/<id> once they are on main, so the
# "Nhà cung cấp" list and the engine / alternator catalog show what was merged. Same checks as upload.mjs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # The row flags (rowflags/current, step "Row flags") also change when the code that reads the tables changes.
    paths: ['suppliers/cn/**', 'suppliers/row-flags.mjs', 'suppliers/spec-diff.mjs', 'web/catalog.js', 'web/spec-norm.js', 'web/conversions.js']

concurrency:
  group: supplier-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not set; skipping."; exit 0; fi
          # A push posts only the records it changed: re-posting all of them makes every open page download the
          # whole supplier set again (~10 MB each time, Supabase egress). A manual run posts everything.
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'suppliers/cn/*.json' | paste -sd, -)
            if [ -z "$changed" ]; then echo "No supplier record added or changed."; exit 0; fi
            node suppliers/upload.mjs --only "$changed"
          else
            node suppliers/upload.mjs
          fi
      # Row flags (Chất lượng 1): the suspect rows of every supplier as ONE doc rowflags/current, listed in the Nhà cung
      # cấp screen. Computed on the whole of suppliers/cn (the cylinder flag depends on all suppliers); written only when
      # the rows differ from the copy on the web. A code-only push skips Publish above ("No supplier record ...").
      - name: Row flags
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not set; skipping."; exit 0; fi
          node suppliers/row-flags.mjs --post
      # Bản chuẩn thông số (bảng riêng spec_std, spec-fields.json; Khoa 24/11/2026: không realtime, không activity_log,
      # không ghi vào docs). Chưa nơi nào đọc. Ghi thật CHỈ khi biến repo SPEC_STD_PUBLISH = 1 VÀ bảng đã được tạo tay
      # (web/supabase/schema.sql); chưa bật thì chỉ in số doc sẽ ghi và tổng byte.
      - name: Spec standard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPEC_STD_PUBLISH: ${{ vars.SPEC_STD_PUBLISH }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not set; skipping."; exit 0; fi
          if [ "$SPEC_STD_PUBLISH" = "1" ]; then node suppliers/spec-standard.mjs --post; else node suppliers/spec-standard.mjs --post --dry; fi
      # Giá trị sai MỚI của bản chuẩn (Khoa 24/11/2026: "cảnh báo cho anh biết để quyết định"). Chạy bộ kiểm giá trị, so với
      # doc specvalue/current của lần trước, in vi phạm mới vào tóm tắt của lượt chạy (+ ::warning::). KHÔNG chặn đăng, không
      # sửa dữ liệu: lỗi hay có ca mới đều không làm workflow đỏ. Lần đầu chỉ lưu mốc. Tắt: biến repo SPEC_VALUE_GATE = 0.
      - name: Spec value gate
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPEC_VALUE_GATE: ${{ vars.SPEC_VALUE_GATE }}
        run: |
          if [ "$SPEC_VALUE_GATE" = "0" ]; then echo "Tắt bằng SPEC_VALUE_GATE=0."; exit 0; fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not set; skipping."; exit 0; fi
          node suppliers/spec-value-gate.mjs
