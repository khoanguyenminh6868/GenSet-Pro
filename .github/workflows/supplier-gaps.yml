name: Supplier gaps

# Việc cần thu thập, hằng tuần: tính thông số nào thiếu trong danh mục đang chặn nhiều gói nhất (suppliers/gaps.mjs)
# và đăng gaps/current cho màn Nhà cung cấp. KHÔNG tự gửi Tìm Thông Số nữa (Khoa, 2026-11-13: "tắt luôn việc tự tìm
# thông số"): mặc định 0 hãng, chỉ tính và đăng danh sách; Tìm Thông Số chạy khi bấm nút trên web. Muốn gửi cho vài hãng
# đứng đầu chưa tìm trong 8 tuần thì chạy tay workflow này với ô "queue", hoặc đặt biến GAPS_QUEUE của repo.
on:
  workflow_dispatch:
    inputs:
      queue:
        description: Số hãng gửi Tìm Thông Số lượt này (để trống = theo GAPS_QUEUE)
        required: false
  schedule:
    # Thứ hai 08:17 giờ Việt Nam.
    - cron: '17 1 * * 1'

concurrency:
  group: supplier-gaps
  cancel-in-progress: false

jobs:
  gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Secret cần có sẵn: SUPABASE_URL và SUPABASE_SERVICE_ROLE_KEY (đọc bidhist/configmatch/specmatch/specreq và
      # supexcl/supdeleted để bỏ NCC loại trừ / xoá mềm; ghi gaps/current). Khoá chỉ nằm trong env, script không in ra
      # log và bước chạy không bật `set -x`. Thiếu khoá → bỏ qua lượt. Có khoá mà không đọc được supexcl/supdeleted →
      # báo cáo vẫn đăng, kèm cảnh báo "chưa lọc NCC loại trừ", và KHÔNG gửi specreq lượt đó.
      - name: Report and queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUEUE: ${{ inputs.queue || vars.GAPS_QUEUE || '0' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not set; skipping."; exit 0; fi
          node suppliers/gaps.mjs --post --queue "$QUEUE"
