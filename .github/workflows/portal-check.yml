name: muasamcong live check

# Calls the real portal to confirm the tender feed still works.
on:
  workflow_dispatch:
  pull_request:
    paths: ['server/src/muasamcong.ts', 'server/scripts/**', '.github/workflows/portal-check.yml']
  schedule:
    - cron: '0 1 * * *' # 08:00 Vietnam time, daily

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Direct request (no browser)
        run: npm run check:portal -- direct
        continue-on-error: true
      - name: Through headless browser
        run: npm run check:portal -- browser
