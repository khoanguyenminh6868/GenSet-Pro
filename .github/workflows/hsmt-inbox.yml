name: hsmt inbox

# Tender documents (public HSMT files from muasamcong) uploaded by the Windows PC worker to the
# GitHub Release "hsmt-<TBMT>" and listed here are recorded in Supabase for GenBid Pro (web) by
# ingest.py; see its docstring for the layout.
permissions:
  contents: read

on:
  push:
    branches: [hsmt-inbox]
    paths: ['inbox/**']
  # Re-run tenders by hand, e.g. after a failed run: keys "IB2600354007 IB2600320499".
  workflow_dispatch:
    inputs:
      keys:
        description: TBMT numbers, space-separated
        required: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Update the package index first: the runner image's cached one can point at removed versions (404).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-vie >/dev/null
      - name: Record changed tenders in Supabase
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BEFORE: ${{ github.event.before }}
          KEYS: ${{ inputs.keys }}
        run: |
          set -euo pipefail
          if [ -n "${KEYS:-}" ]; then
            keys=$KEYS
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            keys=$(git diff --name-only "$BEFORE" HEAD -- inbox | cut -d/ -f2 | sort -u)
          else
            keys=$(ls inbox)
          fi
          echo "Tenders: $keys"
          python3 ingest.py $keys
