name: hsmt inbox

# Tender documents (public HSMT files from muasamcong) pushed here by the Windows PC worker are
# stored in Supabase for GenBid Pro (web) by ingest.py; see its docstring for the layout.
on:
  push:
    branches: [hsmt-inbox]
    paths: ['inbox/**']

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Store changed tenders in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            keys=$(git diff --name-only "$BEFORE" HEAD -- inbox | cut -d/ -f2 | sort -u)
          else
            keys=$(ls inbox)
          fi
          echo "Tenders: $keys"
          python3 ingest.py $keys
