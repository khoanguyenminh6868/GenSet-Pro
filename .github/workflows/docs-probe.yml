name: docs probe (temporary)
on:
  push:
    branches: [claude/genbid-pro-app-vub7eo]
    paths: ['server/scripts/probe-docs.ts', '.github/workflows/docs-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Probe E-HSMT endpoints
        run: npx tsx scripts/probe-docs.ts 14270aa8-9aff-469a-bd93-af627bf1d358 $(jq -r '.tenders[2].id' ../feed-sample.json 2>/dev/null || true)
