name: hsmt requests

# GenBid Pro (web) records "Lấy lại tệp" requests in Supabase (docs hsmtreq/<TBMT>). This copies the
# pending ones to requests.json on the hsmt-inbox branch, where the Windows PC worker (VNeGP Client Agent)
# picks them up; it pushes the files back to inbox/<TBMT>/ and the hsmt-inbox workflow stores them.
on:
  schedule:
    - cron: '5 1-15 * * *'   # hourly, 08:05-22:05 Vietnam time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsmt-inbox
      - name: Write pending requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ]; then echo "Supabase not configured; skipping."; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/docs?coll=eq.hsmtreq&select=id,data" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" |
            jq '[.[] | select(.data.requestedAt and ((.data.doneAt // "") < .data.requestedAt))
                 | {notifyNo: (.data.notifyNo // .id), key: .id, sourceUrl: .data.sourceUrl, bidName: .data.bidName, requestedAt: .data.requestedAt}]
                | sort_by(.requestedAt)' > requests.json
          echo "Pending: $(jq length requests.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests.json
          git diff --cached --quiet && exit 0
          git commit -m "Update pending HSMT requests"
          git push origin hsmt-inbox
