name: temporary probe
on:
  pull_request:
    paths: ['server/scripts/probe-results.ts', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/probe-results.ts
