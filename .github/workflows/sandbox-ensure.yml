name: Bot GenBid dự phòng trong Vercel Sandbox

# Theo nhu cầu (Khoa, 2026-11-17): bot/sandbox/ensure.mjs bật sandbox "genbid-bot" khi web có yêu cầu chờ mà không máy Windows
# nào mở (im ≥ 3 phút), dừng khi rảnh 20 phút hoặc máy Windows bật lại. Web chạy workflow này ngay khi có yêu cầu lúc bot tắt
# (web/api/_wake.js, cần GH_DISPATCH_TOKEN trên Vercel); cron 5 phút là lưới an toàn và lo việc dừng.
# MẶC ĐỊNH TẮT: chỉ chạy khi biến repo GENBID_SANDBOX_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
# Không cần tắt tác vụ "GenBid Bot" trên máy Windows: máy bật lại thì nhường sandbox làm nốt (web/api/requests.js) rồi nhận việc.
# Bí mật (Settings > Secrets): VERCEL_TOKEN, VERCEL_TEAM_ID, VERCEL_PROJECT_ID, GENBID_INGEST_TOKEN,
# CLAUDE_CODE_OAUTH_TOKEN và/hoặc ANTHROPIC_API_KEY, GH_BOT_TOKEN (GitHub PAT có quyền ghi repo, cho Release + nhánh hsmt-inbox),
# tuỳ chọn FIRECRAWL_KEY. Xem bot/sandbox/README.md.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: genbid-sandbox-ensure
  cancel-in-progress: false

jobs:
  ensure:
    if: ${{ vars.GENBID_SANDBOX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: bot/sandbox
      - run: node bot/sandbox/ensure.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GENBID_INGEST_TOKEN: ${{ secrets.GENBID_INGEST_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
          GENBID_BRANCH: main
