name: Giữ bot GenBid chạy trong Vercel Sandbox

# bot/sandbox/ensure.mjs: tạo / nối lại sandbox "genbid-bot", cài lần đầu, khởi chạy bot nếu đang tắt, gia hạn phiên.
# MẶC ĐỊNH TẮT: chỉ chạy khi biến repo GENBID_SANDBOX_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
# Bật cùng lúc với việc tắt tác vụ "GenBid Bot" trên máy Windows: hai bot chạy song song sẽ trả lời trùng yêu cầu web.
# Bí mật (Settings > Secrets): VERCEL_TOKEN, VERCEL_TEAM_ID, VERCEL_PROJECT_ID, GENBID_INGEST_TOKEN,
# CLAUDE_CODE_OAUTH_TOKEN và/hoặc ANTHROPIC_API_KEY, GH_BOT_TOKEN (GitHub PAT có quyền ghi repo, cho Release + nhánh hsmt-inbox),
# tuỳ chọn FIRECRAWL_KEY. Xem bot/sandbox/README.md.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: genbid-sandbox-ensure
  cancel-in-progress: false

jobs:
  ensure:
    if: ${{ vars.GENBID_SANDBOX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: bot/sandbox
      - run: node bot/sandbox/ensure.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GENBID_INGEST_TOKEN: ${{ secrets.GENBID_INGEST_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
          GENBID_BRANCH: main
