<style>
/* Layout: one dense operations column (banner, KPI row, status tabs, tender grid) with a right-side drawer per tender. Dark-first, after the Incident Control Center. */
:root{
  --bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--line:#24304d;--rule:#3e4f78;--fg:#e6eaf5;--muted:#8d98b5;--dim:#5e6a88;
  --tan:#c9a27a;--sky:#7dd3fc;--brand:#ffcc00;--violet:#8b7cf6;--mint:#34d399;--amber:#fbbf24;--rose:#fb7185;--orange:#fb923c;--cyan:#22d3ee;--blue:#60a5fa;
  --violet-soft:rgba(139,124,246,.16);--mint-soft:rgba(52,211,153,.14);--rose-soft:rgba(251,113,133,.14);--amber-soft:rgba(251,191,36,.14);--cyan-soft:rgba(34,211,238,.12);
  --banner-a:#151d36;--banner-b:#0f1529;--wave:rgba(139,124,246,.35);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --green:var(--mint);--red:var(--rose);--yellow:var(--violet);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5fa;--panel:#ffffff;--panel2:#f0f2f9;--line:#dde1ee;--rule:#aab3cc;--fg:#141a2c;--muted:#5b6582;--dim:#8a93ad;
  --tan:#a9753f;--sky:#0ea5e9;--brand:#d19a00;--violet:#6d5ce8;--mint:#059669;--amber:#b7791f;--rose:#e11d48;--orange:#ea580c;--cyan:#0891b2;--blue:#2563eb;
  --violet-soft:rgba(109,92,232,.10);--mint-soft:rgba(5,150,105,.10);--rose-soft:rgba(225,29,72,.09);--amber-soft:rgba(183,121,31,.12);--cyan-soft:rgba(8,145,178,.10);
  --banner-a:#ffffff;--banner-b:#eef0fa;--wave:rgba(109,92,232,.28);
  --shadow:0 1px 2px rgba(20,26,44,.06),0 6px 18px rgba(20,26,44,.06);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f5fa;--panel:#ffffff;--panel2:#f0f2f9;--line:#dde1ee;--rule:#aab3cc;--fg:#141a2c;--muted:#5b6582;--dim:#8a93ad;
  --tan:#a9753f;--sky:#0ea5e9;--brand:#d19a00;--violet:#6d5ce8;--mint:#059669;--amber:#b7791f;--rose:#e11d48;--orange:#ea580c;--cyan:#0891b2;--blue:#2563eb;
  --violet-soft:rgba(109,92,232,.10);--mint-soft:rgba(5,150,105,.10);--rose-soft:rgba(225,29,72,.09);--amber-soft:rgba(183,121,31,.12);--cyan-soft:rgba(8,145,178,.10);
  --banner-a:#ffffff;--banner-b:#eef0fa;--wave:rgba(109,92,232,.28);
  --shadow:0 1px 2px rgba(20,26,44,.06),0 6px 18px rgba(20,26,44,.06);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-gutter:stable;overflow-y:scroll}
table.grid{table-layout:fixed}
table.grid td{white-space:normal!important;overflow-wrap:anywhere}
body{color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
main{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
a{color:var(--violet)}
h1{font:600 24px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 15px/1.25 var(--f-display);margin:0;letter-spacing:.01em}
h3{font:600 14px/1.3 var(--f-body);margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.radios{gap:14px}.radios label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.cmprev{justify-content:space-between}.actbar .btn{padding:4px 9px;font-size:12.5px}
.actrow{margin:14px 0 16px}.actrow.cfgact{margin:4px 0 0}.cfgsum{margin:0}#cfgExtra{min-height:0;height:calc(3em + 4px)}.cmprev .btn{display:inline-flex;align-items:center;gap:5px}
.btn.danger{color:var(--rose)}
/* Tab Giá gợi ý and Sổ báo giá: each kind of button its own colour (Khoa, 2026-11-10): thêm xanh lá, xem xanh dương, sửa tím, tỷ giá vàng, xoá đỏ. */
.btn.tint{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 12%,var(--panel))}.btn.tint:hover{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 20%,var(--panel))}
.tint.c-mint{--tc:var(--mint)}.tint.c-blue{--tc:var(--blue)}.tint.c-cyan{--tc:var(--cyan)}.tint.c-amber{--tc:var(--amber)}.tint.c-violet{--tc:var(--violet)}.tint.c-rose{--tc:var(--rose)}.tint.c-orange{--tc:var(--orange)}
/* Read-only view for people not signed in to Claude: no controls that change data. */
.ro .stepbtns,.ro .selbox,.ro #bulkBar,.ro #refreshBtn,.ro #syncNewBtn,.ro [data-act],.ro #cmRun,.ro #cmDel,.ro #cmSide,.ro #hsRun,.ro #hpDrop,.ro #hcDrop,.ro #cmDrop,.ro #cmText,.ro #tkRun,.ro #tkDrop,.ro #tkCfg,.ro #tyDrop,.ro #tkDel,.ro [data-cfgdel],.ro [data-cfgfind],.ro #tkPdf,.ro #spRun,.ro #runQueueBtn{display:none!important}
.ro #dStage,.ro #dNote{pointer-events:none;opacity:.7}
.ext [data-openpdf]{display:none!important}
.btn.green{background:var(--mint);border-color:var(--mint);color:#fff}
.bpline.none{color:var(--muted);font-weight:500}
.bpline .btn{margin-left:6px}
tr.us td{background:var(--cyan-soft)}
table.bdtbl .rk{display:none}
@media (max-width:640px){table.bdtbl thead,table.bdtbl td.c-rk{display:none}table.bdtbl,table.bdtbl tbody,table.bdtbl tr,table.bdtbl td{display:block;width:auto}table.bdtbl tr{padding:8px 10px;border-bottom:1px solid var(--line)}table.bdtbl tr.us{background:var(--cyan-soft)}table.bdtbl td{border:0;padding:2px 0;text-align:left;background:none!important}table.bdtbl .rk{display:inline}table.bdtbl td[data-l]::before{content:attr(data-l) ": ";color:var(--dim)}}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;color:var(--fg)}
.ibtn svg{width:17px;height:17px}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=url],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.5}
.tkcfg{display:flex;flex-direction:column;gap:6px}
/* Đối chiếu TLKT and Tạo HSDT: lower file boxes, result set off from its PDF/Xóa row (Khoa, 2026-11-04). */
#tyDrop,#tkDrop,#hpDrop,#hcDrop{padding:7px 10px}#tyDrop .files:empty,#tkDrop .files:empty,#hpDrop .files:empty,#hcDrop .files:empty{display:none}
.note{border-left:3px solid var(--blue);background:var(--cyan-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.warn{border-color:var(--amber);background:var(--amber-soft)}
.note.err{border-color:var(--rose);background:var(--rose-soft)}

/* Banner */
.banner{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(120deg,var(--banner-a),var(--banner-b));box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* Banner accent: brand yellow instead of the app violet. */
.banner{--violet:#ffcc00;--violet-soft:rgba(255,204,0,.18);--wave:rgba(255,204,0,.4)}
.banner .mark{color:#1f1a00}
.banner svg.wave{position:absolute;right:0;top:0;height:100%;width:62%;pointer-events:none}
.mark{width:46px;height:46px;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.mark svg{width:28px;height:28px}
.banner a.home{display:flex;gap:16px;align-items:center;color:inherit;text-decoration:none;position:relative;min-width:0;-webkit-tap-highlight-color:transparent}
.banner a.home:focus{outline:none}
html.kbd .banner a.home:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.btitle{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.btitle h1 span{color:var(--violet)}
.btitle .tag{color:var(--muted);font-size:13px}
.bmeta{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;flex-wrap:wrap}
/* Sync result: its own row at the bottom of the banner, right-aligned under the icons. */
.bnote{flex-basis:100%;position:relative;color:var(--muted);font-size:12.5px;line-height:1.45;display:flex;gap:8px;align-items:center;justify-content:flex-end;text-align:right;margin-top:-6px}
.bnote[hidden]{display:none}
.bnote.warn{color:var(--orange)}.bnote.err{color:var(--red)}
.bnote span{max-width:min(820px,75%)}
.bnote .ibtn{width:24px;height:24px;flex:none}
/* Wins found by Sync: one row each under the banner, until closed. */
#wonNotes{display:flex;flex-direction:column;gap:8px}
#wonNotes:empty{display:none}
.note.won{border-color:var(--mint);background:var(--mint-soft);display:flex;gap:10px;align-items:center}
.note.won svg{width:18px;height:18px;color:var(--mint);flex:none}
.note.won .wtext{flex:1;min-width:0}
.note.won .ibtn{width:24px;height:24px;flex:none}
.note.won .linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--mint);text-decoration:underline;cursor:pointer}
@media (max-width:640px){.bnote{justify-content:space-between;text-align:left;margin-top:0;padding-top:10px;border-top:1px dashed var(--line)}.bnote span{max-width:none}}
.syncline .spin{width:10px;height:10px}
.syncline{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syncline .ibtn{width:30px;height:30px}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
#stageTabs .tshort{display:none}
@media (max-width:640px){#stageTabs .tlong{display:none}#stageTabs .tshort{display:inline}}
@media (max-width:640px){#count{display:none}.banner{padding:12px 14px;gap:12px}}
@media (max-width:640px){.navbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:100%}.navbtns .btn{justify-content:center;padding-inline:2px;gap:3px;min-width:0;font-size:12px}.navbtns .btn svg{flex-shrink:0}}
/* Sync, new-only and log light up yellow on hover like the banner buttons (Khoa, 2026-11-04). */
/* Hover only with a real mouse: on touch the tapped button kept the hover border after Sync (Khoa, 2026-11-05). */
@media (hover:hover){.syncline .ibtn:hover{border-color:var(--violet)}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.dot.busy{background:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.spec{font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.04em}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;color:var(--fg)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--violet))}
.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .kv{font:600 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12px;color:var(--dim)}
.kpi{cursor:pointer}
.sizehead{margin:0;font-size:16px;font-weight:600;border-top:1px solid var(--line);padding:8px 0;color:var(--green)}.sizebox[open]>.sizehead{margin-bottom:4px}.sizebox[open]+.sizebox{margin-top:12px}
.sizebox>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.sizebox>summary::-webkit-details-marker{display:none}
.sizebox .chev{display:inline-block;transition:transform .15s}.sizebox:not([open]) .chev{transform:rotate(-90deg)}
/* Động cơ / Đầu phát / Bộ điều khiển / Tổ máy tham chiếu / Đã trúng thầu cách nhau (Khoa, 2026-11-10). */
.cfgblk+.cfgblk{margin-top:12px}
.cfgsupdel{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.cfgdelbtn{padding:3px 6px;color:var(--red);flex-shrink:0}
.cfgcard>summary{align-items:center}.cfgcard[open]>summary{margin-bottom:6px}.cfgcard .cfgparts{font-weight:400}
.cfggrid{margin:6px 0}.cfggrid>summary{padding:4px 0;align-items:center}.cfggrid[open]>summary{margin-bottom:4px}
.kpi.bplev{cursor:default}.kpi.bplev .kv{font-size:20px}

.kpi.bp-low{--kc:var(--mint)}.kpi.bp-mid{--kc:var(--blue)}.kpi.bp-high{--kc:var(--orange)}
.kpi:hover,.kpi.on{border-color:var(--kc)}
.kpi .kref{position:absolute;top:10px;right:10px;width:30px;height:30px}
.lrow{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;color:var(--fg)}
.lrow:hover{border-color:var(--violet)}
/* Ghi chú nội bộ in the list (Khoa, 2026-11-09): under Hình thức on a desktop, under Địa điểm on a phone. */
/* Overview: investor in the banner yellow (--brand), close date red like the grid, grid note orange (Khoa, 2026-11-09). */
.nline{color:var(--orange);font-size:12.5px;margin-top:4px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.nline::before{content:"Ghi chú: ";color:var(--dim)}.mnote{display:none}
a.invlink{color:var(--brand);font-weight:600;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}a.invlink:hover{text-decoration-color:currentColor}
.invsum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

/* Status tabs */
.tabsbar{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--panel2);max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--violet-soft);color:var(--fg);font-weight:600}
.seg .c{font:600 11.5px var(--f-mono)}
.seg .c:not([class*="st-"]){color:var(--brand)}
.seg button[aria-selected="true"] .c:not([class*="st-"]){color:var(--brand)}
.seg.cattabs{margin-bottom:10px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:max-content}.seg.cattabs button{justify-content:center}
@media (max-width:640px){.seg.cattabs{width:auto;grid-auto-columns:minmax(0,1fr)}.seg.cattabs button{flex-direction:column;gap:2px;padding:6px 4px}}
/* Catalog search: wider, the Hãng / Thông số lists capped (their options are long). */
@media (min-width:641px){#catMake,#catSpec{max-width:170px}}

/* Grid */
.gridcard{padding:0;overflow:hidden}
.gridwrap{overflow-x:auto;scrollbar-width:none}
.gridwrap::-webkit-scrollbar{display:none}
.thc{display:flex;align-items:center;gap:4px}
.thsort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;white-space:nowrap;text-align:left}
.thsort:hover{color:var(--fg)}

.thf:hover{color:var(--fg);background:var(--panel2)}
.thf.on{color:var(--brand);background:rgba(255,204,0,.18)}
.fpop{position:fixed;z-index:60;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.fpop select,.fpop input{width:100%}
.fchks{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}.fchk{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;cursor:pointer}.fpop .fchk input{width:auto}
.tlink{text-decoration:none}
.tlink:hover{text-decoration:underline}
td.noc{min-width:170px}
td.locc{white-space:normal!important;min-width:90px;max-width:130px}

.aicon.run{background:var(--violet-soft);color:var(--violet)}
.aicon.bad{background:var(--rose-soft);color:var(--rose)}
.aicon.mut{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.aline{margin-top:5px;display:flex}
.closed-at{color:var(--rose)!important}
.pline{color:var(--mint);font-weight:600;margin-top:4px}.mprice{display:none}.fline{color:var(--dim);font-size:12.5px;margin-top:2px}.mform{display:none}
.bpline{color:var(--cyan);font-weight:600;margin-top:2px}
.stepbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
/* Each move button takes the colour of the stage it moves to (st-* class). */
.sbtn{height:24px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent);border-radius:6px;display:inline-flex;align-items:center;gap:3px;padding:0 7px 0 5px;font-size:11.5px;font-weight:600;white-space:nowrap}

.sbtn:disabled{opacity:.35;cursor:default}

.modal.wide{width:min(1040px,100%)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;background:var(--panel)}
table.grid{min-width:1060px;font-size:13px}
td.capc{white-space:normal!important;min-width:120px;max-width:190px}

const $ = (s, el = document) => el.querySelector(s);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (strings, ...vals) => strings.reduce((a, s, i) => a + s + (i < vals.length ? (vals[i] && vals[i].__html !== undefined ? vals[i].__html : esc(vals[i])) : ""), "");

const TZ = "Asia/Ho_Chi_Minh";
function fmtDate(iso, withTime = true) {
  if (!iso) return "";

// Banner sync time as "HH:mm MM/DD/YY" (the user's chosen format for the banner only).
function fmtBannerDate(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, month: "2-digit", day: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));

      : h`<div class="kpis" style="margin:8px 0"><div class="kpi"><span class="kl">Giá vốn</span><span class="kv">${fmtVnd(Math.round(cost))}</span><span class="ks">${bpPct(cost / P)} giá gói · ${supName(state.supplier?.[pick.r.supplierId]) || pick.r.supplierId}${finTotal ? ` · gồm chi phí vốn ${fmtVnd(Math.round(finTotal))}` : ""}</span></div>
        ${raw(pt.best ? h`<div class="kpi bplev bp-low"><span class="kl">Giá có lợi nhuận kỳ vọng cao nhất</span><span class="kv">${fmtVnd(pt.best.price)}</span><span class="ks">${bpPct(pt.best.r)} giá gói · thắng khoảng ${pct0(pt.best.w)} · lãi nếu trúng ${fmtVnd(Math.round(pt.best.margin))}</span></div>`

async function saveProject(key, patch) {

  const rec = { ...stripTender(state.manual[key]), ...patch, updatedAt: new Date().toISOString() };

  if (state.db) { if (!(await dbSet("manual/" + key, rec))) { toast("Không lưu được dự án."); return false; } }

// Uploaded files (a project's, or a tender's HSMT added by hand with Upload) go to the file store; their text is written as hsmttext/<key>_<i> and the list as hsmt/<key>, the way
// the worker publishes a tender's HSMT, so Phân tích, YCKT tiếng Anh, HSDT tham khảo and Đối chiếu read them unchanged.
const PROJ_TEXT = /\.(pdf|docx|txt|md|csv)$/i;
function textByFile(all) {
  const out = new Map();
  for (const m of String(all).matchAll(/--- Tệp: (.+?) ---\n([\s\S]*?)(?=\n\n--- Tệp: |$)/g)) out.set(m[1], m[2]);
  return out;
}
async function saveProjectFiles(key, files, texts) {
  const all = files.filter((f) => texts.has(f.name)).map((f) => `--- Tệp: ${f.name} ---\n${texts.get(f.name).trim()}`).join("\n\n");
  const parts = all ? chunkText(all, 60000) : [], old = state.hsmt[key]?.textChunks || 0;
  for (const [i, text] of parts.entries()) if (!(await dbSet(`hsmttext/${key}_${i}`, { text }))) throw new Error("không lưu được nội dung tệp");
  for (let i = parts.length; i < old; i++) await state.db.doc(`hsmttext/${key}_${i}`).delete().catch(() => {});
  const rec = { notifyNo: key, updatedAt: new Date().toISOString(), source: "tải tay", files, textChunks: parts.length };
  if (!(await dbSet("hsmt/" + key, rec))) throw new Error("không lưu được danh sách tệp");
  state.hsmt = { ...state.hsmt, [key]: rec };
}
async function addProjectFiles(key, list) {
  if (!list.length) return;
  if (state.readOnly || !state.db) { toast("Đăng nhập để tải tệp lên."); return; }
  let store = null;
  try { store = await window.claude?.use?.("assets"); } catch {}
  if (!store) { toast("Chế độ xem này không tải tệp lên được."); return; }
  try {
    const texts = textByFile(await loadAttachedText(key)), files = [...(state.hsmt[key]?.files || [])];
    for (const [n, f] of list.entries()) {
      projUp[key] = `Đang tải lên ${f.name} (${n + 1}/${list.length})...`; renderDrawer(false);
      const up = await store.upload(f);
      let text = "";
      if (PROJ_TEXT.test(f.name)) { try { text = (await readFile(f)).text || ""; } catch {} }
      const hasText = text.replace(/\[Trang \d+\]|\s/g, "").length > 40;
      const rec = { name: f.name, size: f.size, hasText, converted: false, url: up.url, manual: true };
      const i = files.findIndex((x) => x.name === f.name);
      if (i >= 0) files[i] = rec; else files.push(rec);
      if (hasText) texts.set(f.name, text); else texts.delete(f.name);
    }
    projUp[key] = "Đang lưu nội dung tệp..."; renderDrawer(false);
    await saveProjectFiles(key, files, texts);
    toast(`Đã tải lên ${list.length} tệp`);
  } catch (e) { toast("Không tải được tệp lên: " + (e?.message || "lỗi không rõ"), 6000); }
  finally { delete projUp[key]; renderDrawer(false); }
}

// Tender files only download through VNeGP Client Agent on the Windows PC. "Lấy lại tệp" records a request in
// hsmtreq/<key>; the PC worker fetches the files from the muasamcong page and stores them, then marks it done.
function reqState(key) {
  const r = state.hsmtreq?.[key];
  if (!r?.requestedAt) return null;
  if (r.doneAt && r.doneAt >= r.requestedAt) return r.error ? { kind: "error", r } : null;
  const got = state.hsmt[key]?.updatedAt;
  if (got && got >= r.requestedAt) return null;
  return { kind: "pending", r };
}
function refetchHtml(t) {
  if (state.readOnly) return "";
  const s = reqState(t._key);
  if (projUp[t._key]) return h`<div class="note">${raw(progress(projUp[t._key]))}</div>`;
  if (s?.kind === "pending") return waitHtml("Đang tải hồ sơ từ muasamcong bằng Agent...", s.r.requestedAt) + h`<div class="row"><label class="btn" for="pFiles" title="Không muốn chờ Agent: tải tay tệp PDF, DOCX">Upload</label><input type="file" id="pFiles" multiple hidden accept=".pdf,.docx,.doc,.xlsx,.txt,.md,.csv,image/*"></div>`;
  const warn = state.hsmt[t._key]?.files?.some((f) => f.manual) ? "Có tệp tải tay. Lấy lại tệp từ muasamcong sẽ thay cả danh sách, tệp tải tay sẽ mất." : "Lấy lại tệp từ muasamcong";
  return h`${raw(s?.kind === "error" ? h`<div class="note warn small">Lần lấy tệp trước không được: ${s.r.error}</div>` : "")}<div class="row" style="justify-content:flex-end">
    <label class="btn" for="pFiles" title="Tải tay tệp PDF, DOCX làm hồ sơ mời thầu">Upload</label>
    <input type="file" id="pFiles" multiple hidden accept=".pdf,.docx,.doc,.xlsx,.txt,.md,.csv,image/*">
    <button class="btn primary" id="hfFetch" data-key="${t._key}" title="${warn}">Lấy lại tệp</button></div>`;
}
// Sync on the web: ask the Windows worker for files of every open Mới tender that has none and no request yet.
async function requestMissingFiles() {
  if (state.readOnly || !state.db) return 0;

// The bot asks the web for requests every minute (botstatus/current.lastPollAt). Silent for 3 minutes = the PC is off.
function botOfflineText() {
  if (state.botstatus === undefined) return "";
  const at = state.botstatus?.lastPollAt;
  if (at && Date.now() - new Date(at).getTime() < 3 * 60e3) return "";
  return at ? `Agent chưa nhận yêu cầu (lần cuối kết nối lúc ${fmtDate(at)}). Yêu cầu sẽ được xử lý khi Agent bật lại.` : "Agent chưa kết nối. Yêu cầu sẽ được xử lý khi Agent bật lại.";
}
const sinceText = (iso) => { const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60e3)); return m < 1 ? "vừa gửi" : `đã chờ ${m} phút`; };
// A request waiting for the worker: spinner and label until the answer arrives, with the waiting time and a
// warning when the PC is off. refreshWaits() updates those in place so nothing else on the page re-renders.
function waitHtml(label, iso) {
  const off = botOfflineText();
  return h`<div class="note row">${raw(progress(""))}<span style="flex:1;min-width:200px">${label} <span class="muted small" data-since="${iso}">(${sinceText(iso)})</span></span></div>
    <div class="note warn" data-botwarn ${raw(off ? "" : "hidden")}>${off}</div>`;
}
function refreshWaits() {
  $$("[data-since]").forEach((el) => (el.textContent = `(${sinceText(el.dataset.since)})`));
  const off = botOfflineText();
  $$("[data-botwarn]").forEach((el) => { el.textContent = off; el.hidden = !off; });
}
setInterval(refreshWaits, 30e3);
// While a request waits for Agent, re-read its answer every 10 seconds, so the result shows (and the waiting
// note goes away) even if the realtime change never reaches this page. Nothing is read when nothing waits.
async function pollPending() {
  if (!state.db?.refresh || document.hidden) return;
  const paths = [];

function trPrimeKva(secs, t) {
  const num = (v) => parseFloat(String(v).trim().replace(/[.,\s](?=\d{3}(?!\d))/g, "").replace(",", "."));

    }
    return out;

  const list = [pick(brief, "prime|PRP|continuous"), pick(capText, "liên tục|prime|PRP"), pick(capText, "").slice(0, 1)].find((l) => l.length);

async function tlktPdf(key, btn = $("#tkPdf")) {

      if (workerReqPending("tlktreq", key)) { autoPdf[key] = Date.now(); local.set("tlktAutoPdf", autoPdf); }
      return;
    }
    btn.textContent = "Đang tạo PDF...";
    const [{ jsPDF }, f] = await Promise.all([loadLib("jspdf"), fonts()]);
    const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape" });
    doc.addFileToVFS("DejaVuSans.ttf", f.normal); doc.addFont("DejaVuSans.ttf", "DejaVu", "normal");
    doc.addFileToVFS("DejaVuSans-Bold.ttf", f.bold); doc.addFont("DejaVuSans-Bold.ttf", "DejaVu", "bold");

    const text = (s, size, bold, gap = 1.5) => {
      doc.setFont("DejaVu", bold ? "bold" : "normal"); doc.setFontSize(size);
      const lh = size * 0.42;
      for (const ln of doc.splitTextToSize(String(s ?? ""), W)) { need(lh); doc.text(ln, M, y + lh * 0.8); y += lh; }
      y += gap;
    };
    text("Technical Proposal Compliance Review", 16, true, 2);
    y += 1;
    if (en.supplier || en.offer) text([en.supplier, en.offer].filter(Boolean).join(" · "), 10, true, 2);
    text(`Result: ${TLKT_VERDICT_EN[en.verdict] || en.verdict || ""} · Score ${Math.round(en.overallScore || 0)}/100`, 11, true, 1.5);
    text(en.summary || "", 10, false, 2);
    const items = en.items || [];
    text(Object.entries(STATUS_EN).map(([k, l]) => `${items.filter((i) => i.status === k).length} ${l}`).join(" · "), 9, false, 3);
    // Table: requirement | proposal | result | note, rows split across pages line by line.
    const cols = [{ w: 0.32, h: "Technical requirement" }, { w: 0.28, h: "Supplier's proposal" }, { w: 0.1, h: "Result" }, { w: 0.3, h: "Note" }].map((c) => ({ ...c, w: c.w * W }));
    const FS = 8, LH = FS * 0.42, PAD = 1.5;

      doc.setFillColor(230, 230, 230); doc.rect(M, y, W, LH + 2 * PAD, "F");
      doc.setFont("DejaVu", "bold"); doc.setFontSize(FS);
      let x = M; for (const c of cols) { doc.text(c.h, x + PAD, y + PAD + LH * 0.8); x += c.w; }
      y += LH + 2 * PAD;
    };
    need(20); head();
    for (const i of items) {
      const cells = [
        [i.group, (i.critical ? "[Mandatory] " : "") + (i.requirement || ""), i.requirementRef].filter(Boolean).join("\n"),
        [i.offered || "—", i.offeredRef].filter(Boolean).join("\n"),
        STATUS_EN[i.status] || i.status || "",

async function uploadOrText(key, list, pasted, out, dir = "tlkt") {

    try { files = await window.genbidScratch(key, all.filter((f) => !big.includes(f)), dir); }
    catch (e) { asText = all; why = e?.message || "không tải tệp lên được"; }
  }
  for (const f of asText) {

    const r = await readFile(f).catch(() => ({ text: "" }));
    if (!r.text?.trim()) throw new Error(`${f.name}: ${why}, và trang không đọc được chữ trong tệp (bản scan hoặc ảnh). Hãy thử lại, hoặc chia nhỏ tệp.`);

// Power in a name, genset names, supply vs repair, the power the bot read from a past HSMT: web/bidprice.js, shared with the bot.
const { kvaOf, isGensetName, taxKey } = window.GenbidBidprice;

function histDocs() {
  const out = Object.fromEntries(Object.entries(state.bidhist || {}).filter(([, d]) => isGensetName(d.bidName)));
  for (const [key, b] of Object.entries(state.bidders || {})) {
    if (out[key] || !b?.list?.length) continue;
    const t = findTender(key) || {};
    out[key] = { notifyNo: key, bidName: t.bidName || "", investorName: t.investorName || "", location: t.location || "", bidForm: t.bidForm || "",
      bidCloseDate: t.bidCloseDate || null, openedAt: t.bidOpenDate || t.bidCloseDate || null, estimatedPrice: t.estimatedPrice ?? null, final: !!b.final, url: b.url || t.sourceUrl || "",
      lots: [{ lotNo: "", lotName: "", price: b.packagePrice ?? t.estimatedPrice ?? null, goods: [],
        bidders: b.list.map((x) => ({ name: x.name, taxCode: x.taxCode, bidPrice: x.bidPrice ?? null, discount: x.discount || "", finalPrice: x.priceAfterDiscount ?? x.bidPrice ?? null, won: !!x.won, reason: x.note || "" })) }] };
  }

}
// One row per bidder per lot, grouped by tax code.
function histIndex() {
  if (histIdx) return histIdx;
  const by = new Map();
  for (const [key, d] of Object.entries(histDocs())) {
    const multi = (d.lots || []).length > 1;
    for (const lot of d.lots || []) for (const b of lot.bidders || []) {
      const id = taxKey(b);
      if (!id) continue;
      let c = by.get(id);
      if (!c) by.set(id, (c = { id, tax: String(b.taxCode || "").replace(/\D/g, ""), names: {}, rows: [], n: 0, wins: 0, wonValue: 0, lastAt: "" }));
      c.names[b.name] = (c.names[b.name] || 0) + 1;
      const at = d.openedAt || d.bidCloseDate || d.publicDate || "";
      c.rows.push({ key, d, lot, b, at, multi });
      c.n++;
      if (b.won) { c.wins++; c.wonValue += Number(b.winPrice ?? b.finalPrice ?? b.bidPrice) || 0; }
      if (at > c.lastAt) c.lastAt = at;
    }
  }
  for (const c of by.values()) {
    c.name = Object.entries(c.names).sort((a, b) => b[1] - a[1])[0][0];
    c.tenders = new Set(c.rows.map((r) => r.key)).size;
    c.decided = c.rows.filter((r) => r.d.final).length;
  }
  return (histIdx = [...by.values()]);
}
const bdPrice = (b) => b.finalPrice ?? b.bidPrice;

// The won goods one per line, with the columns muasamcong lists (Khoa, 2026-11-07): Hãng sản xuất, nhãn hiệu, ký mã
// hiệu, xuất xứ, khối lượng, đơn giá, and "Cấu hình, tính năng kỹ thuật cơ bản" folded (often thousands of characters,

  if (key.length >= 5 && keys.includes(key)) return { key };
  const pre = key.length >= 4 ? keys.filter((k) => k.startsWith(key)) : [];

// ---------- Modal ----------
function modal(html, onMount, cls = "") {
  if (screenOfUrl()) setScreenUrl();
  const ov = $("#ov"); $("#mdl").className = "modal " + cls; $("#mdl").innerHTML = html; ov.hidden = false;
  const close = () => { ov.hidden = true; $("#mdl").innerHTML = ""; if (screenOfUrl()) setScreenUrl(); };
  // On a phone a tap outside the window does nothing: it closes only with its own buttons, Escape or Back (Khoa,
  // 2026-11-04). With a mouse a click outside closes it too (Khoa, 2026-11-04), unless the press began inside (a text
  // selection dragged out of the window).
  ov.onmousedown = (e) => { ov._downOut = e.target === ov; };
  ov.onclick = (e) => { if (e.target.closest("[data-close]") || (e.target === ov && ov._downOut && matchMedia("(hover: hover) and (pointer: fine)").matches)) close(); };
  onMount?.($("#mdl"), close);
}
// ---------- Back ----------
// Back (or a swipe on a phone) always comes back to what was on screen before (Khoa, 2026-11-04). Each step of the UI (a
// tender, a KPI list, a screen and its detail, a dialog) is a browser history entry, pushed right after the tap that made it
// (an entry pushed without a tap is skipped by Chrome's Back), holding what was open and where it was scrolled. A step
// closed with the page's own buttons (X, ← Danh sách, Escape) takes its entry away. The first entry stays behind the home
// screen, so Back never leaves the page (behind it was the Google sign-in, whose replay is a 400).
const NAV_HOME = { open: null, dtab: "info", list: null, back: [], scr: null, sup: null, bd: null, cat: null, catOpen: null, catFrom: null, dscroll: 0, mscroll: 0 };
function navSnap() {
  const scr = $("#ov").hidden ? null : $("#supBody") ? "sup" : $("#bdBody") ? "bd" : $("#catBody") ? "cat" : "dlg";
  return { open: state.open, dtab: state.dtab, list: state.list, back: drawerBack.slice(), scr,
    sup: scr === "sup" ? supOpenId : null, bd: scr === "bd" ? bdOpenId : null,
    cat: scr === "cat" ? catView.kind : null, catOpen: scr === "cat" ? catView.open : null, catFrom: scr === "cat" ? catFrom : null,
    dscroll: $("#dbody").scrollTop, mscroll: scr ? mScroll().scrollTop : 0, url: location.href };
}
const navKey = (s) => JSON.stringify([s.open, s.list, s.scr, s.sup, s.bd, s.cat, s.catOpen]);
// navStack mirrors this page's history entries; 0 is the page's first entry, 1 the home screen pushed on the first tap.
let navStack = [NAV_HOME], navAt = 0, navSkip = 0, navPre = null, navPopAt = 0;
function navTap() {

}

  if (navAt > 1 && k === navKey(navStack[navAt - 1])) { navAt--; navStack[navAt] = s; navSkip++; history.back(); return; }
  if (navPre) navStack[navAt] = { ...navStack[navAt], ...navPre };

  try { if (navStack[navAt].url) history.replaceState({ gb: navAt }, "", navStack[navAt].url); history.pushState({ gb: navAt + 1 }, "", s.url); } catch {}

}

  if (s.open && findTender(s.open)) { if (state.open !== s.open) openDrawer(s.open, s.dtab); }
  else if (s.list) { if (state.list !== s.list || state.open) openList(s.list); }
  else if (state.open || state.list) { drawerBack = []; closeDrawer(); }
  drawerBack = (s.back || []).slice();

  if (s.scr === "sup") { if ($("#supBody")) { supOpenId = s.sup; renderSuppliers(); } else openSuppliers(s.sup); }
  else if (s.scr === "bd") { if ($("#bdBody")) { bdOpenId = s.bd; renderBidders(); } else openBidders(s.bd, s.mscroll); }
  else if (s.scr === "cat") { if ($("#catBody") && catView.kind === s.cat) { catView.open = s.catOpen; catFrom = s.catFrom; renderCatalog(); } else openCatalog(s.cat, s.catOpen, s.catFrom); }

  if (!$("#fpop").hidden) closeFilter();

const navHashOk = () => Date.now() - navPopAt > 500;
document.addEventListener("click", navTap, true);
document.addEventListener("keydown", navTap, true);
// The step is pushed in the same task as the tap, before the browser paints it: the screenshot a phone shows while swiping

// the event before window, or opens a step after an await, is caught a moment later.
for (const ev of ["click", "keydown"]) { addEventListener(ev, navSync); document.addEventListener(ev, () => setTimeout(navSync, 0)); }

const blurHome = () => { if (document.activeElement?.closest?.("a.home")) document.activeElement.blur(); };

addEventListener("keydown", (e) => { if (e.key === "Tab") document.documentElement.classList.add("kbd"); }, true);

try { history.scrollRestoration = "manual"; } catch {}

  if (e.target.id === "cmRun") { const k = e.target.dataset.key, has = subPick?.files.length || $("#cmText")?.value.trim(); state.compare[k]?.result && has ? askRecompare(k) : runCompare(k); return; }
  if (e.target.id === "tkRun") { runTlkt(e.target.dataset.key); return; }
  if (e.target.id === "cmAccepted") { askAccept(e.target.dataset.key); return; }
  if (e.target.id === "hfFetch") { const k = e.target.dataset.key; if (!state.hsmt[k]?.files?.some((f) => f.manual) || confirm("Lấy lại tệp từ muasamcong sẽ thay cả danh sách, tệp tải tay sẽ mất. Tiếp tục?")) requestRefetch(k); return; }
  if (e.target.id === "newProject") { askNewProject(); return; }
  const pd = e.target.closest("[data-pdel]");
  if (pd && state.open) { askRemoveProjectFile(state.open, +pd.dataset.pdel); return; }
  if (e.target.id === "qAdd" && state.open) { const k = state.open; saveQuote(k, [...quoteRows(k), { id: Date.now().toString(36), supplierId: "", files: [] }]); return; }
  const qi = e.target.closest("[data-qitem]");
  if (qi && state.open) { const [r, i] = qi.dataset.qitem.split(":"); askQuoteItem(state.open, r, i); return; }
  if (e.target.id === "qCost" && state.open) { askQuoteCost(state.open); return; }
  const qh = e.target.closest("[data-qhint]");
  if (qh && state.open) { const x = costHintsOf(state.open)[+qh.dataset.qhint]; if (x) askQuoteCost(state.open, { label: x.label, kind: x.kind }); return; }
  if (e.target.closest("#qFin") && state.open) { askFinance(state.open); return; }
  if (e.target.id === "qAll") { askQuoteAll(); return; }
  if (e.target.id === "qLedger") { openQuoteLedger(); return; }
  if (e.target.id === "qNear" && state.open) { e.preventDefault(); const t = findTender(state.open); openQuoteLedger(t && kvaOf(capacityOf(t)?.text), t && quoteNeedOf(t)); return; }
  const ps = e.target.closest("[data-pscen]");
  if (ps && state.open) { profitScen[state.open] = ps.dataset.pscen; renderDrawer(false); return; }
  const qo = e.target.closest("[data-qopen]");
  if (qo && state.open) { const [r, i] = qo.dataset.qopen.split(":"); openQuoteFile(state.open, r, +i); return; }
  const qd = e.target.closest("[data-qdel]");
  if (qd && state.open) { const [r, i] = qd.dataset.qdel.split(":"); askRemoveQuote(state.open, r, +i); return; }
  const qr = e.target.closest("[data-qrowdel]");
  if (qr && state.open) { askRemoveQuote(state.open, qr.dataset.qrowdel); return; }
  if (e.target.id === "hfCancel") { requestRefetch(e.target.dataset.key, true); return; }
  if (e.target.id === "cmSubmit") { setStage(e.target.dataset.key, "submitted"); return; }
  if (e.target.closest("#tkPdf")) { const b = e.target.closest("#tkPdf"); tlktPdf(b.dataset.key, b); return; }
  const cd = e.target.closest("[data-cfgdel]");
  if (cd) { e.preventDefault(); askDeleteCfg(cd.dataset.cfgdel, cd.dataset.size, cd.dataset.rank); return; }
  if (e.target.closest("#tkDel")) { askDeleteTlkt(e.target.closest("#tkDel").dataset.key); return; }
  if (e.target.closest("#cmDel")) { askDeleteCompare(e.target.closest("#cmDel").dataset.key); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "cfgExtra") cfgExtra[e.target.dataset.key] = e.target.value;
  const k = e.target.dataset?.filter;
  if (k && e.target.tagName === "INPUT") { state.filters[k] = e.target.value; renderGrid(); }
  if (e.target.id === "q") { state.limit = pageSize(); renderGrid(); }
  if (e.target.id === "fval" && e.target.tagName === "INPUT") applyFilter(e.target.value);
  if (e.target.closest?.("#trEdit") && state.open) saveTrEdit(state.open, secsToText(trFromDoc() || []));
  const hs = e.target.closest?.("[data-h]");
  if (hs && state.open) saveHsEdit(state.open, hs.dataset.h, richHtml(hs));
  const er = edRoot(e.target);
  if (er) histLater(er);
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset?.filter;
  if (k && e.target.tagName === "SELECT") { state.filters[k] = e.target.value; renderGrid(); }
  if (e.target.classList?.contains("fchkbox")) { applyFilter([...document.querySelectorAll("#fpop .fchkbox:checked")].map((x) => x.value).join("|")); return; }
  if (e.target.id === "fval" && e.target.tagName === "SELECT") { applyFilter(e.target.value); closeFilter(); }
  if (e.target.id === "dStage" && state.open) setStage(state.open, e.target.value);
  const pf = { pName: "bidName", pInvestor: "investorName", pLoc: "location" }[e.target.id];
  if (pf && state.open) {
    const v = e.target.value.trim();
    if (pf === "bidName" && !v) { e.target.value = findTender(state.open)?.bidName || ""; toast("Tên dự án không được để trống."); }
    else if (v !== (state.manual[state.open]?.[pf] || "")) saveProject(state.open, { [pf]: v });
  }
  if (e.target.id === "pFiles" && state.open) { const list = [...e.target.files]; e.target.value = ""; addProjectFiles(state.open, list); }
  if (e.target.dataset?.qsup && state.open) { const k = state.open, id = e.target.dataset.qsup, v = e.target.value; saveQuote(k, quoteRows(k).map((r) => (r.id === id ? { ...r, supplierId: v } : r))); }
  if (e.target.id === "profitRowSel" && state.open) { profitRow[state.open] = e.target.value; renderDrawer(false); }
  if (e.target.dataset?.qfiles && state.open) { const list = [...e.target.files]; e.target.value = ""; addQuoteFiles(state.open, e.target.dataset.qfiles, list); }
  if (e.target.id === "dNote" && state.open) {
    const key = state.open, t = findTender(key), prev = state.tracked[key] || {};
    if ((prev.note || "") !== e.target.value) saveTracked(key, { ...prev, stage: prev.stage || "new", note: e.target.value, tender: prev.tender || stripTender(t), updatedAt: new Date().toISOString() });
  }
});
// Dropping files on a project's upload box.
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("#pDrop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => e.target.closest?.("#pDrop")?.classList.remove("over"));
document.addEventListener("drop", (e) => { if (!e.target.closest?.("#pDrop") || !state.open) return; e.preventDefault(); addProjectFiles(state.open, [...e.dataTransfer.files]); });
// Dropping files on a supplier of Báo giá của Nhà Cung Cấp, once one is chosen.
const quoteDrop = (e) => { const d = e.target.closest?.("[data-qrow]"); return d && state.open && !state.readOnly && quoteRows(state.open).find((r) => r.id === d.dataset.qrow)?.supplierId ? d : null; };
document.addEventListener("dragover", (e) => { const d = quoteDrop(e); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => e.target.closest?.("[data-qrow]")?.classList.remove("over"));
document.addEventListener("drop", (e) => { const d = quoteDrop(e); if (!d) return; e.preventDefault(); d.classList.remove("over"); addQuoteFiles(state.open, d.dataset.qrow, [...e.dataTransfer.files]); });
$("#toTop").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
$("#toBottom").addEventListener("click", () => scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }));
$("#clearFilters").addEventListener("click", () => { state.filters = {}; $("#q").value = ""; state.limit = pageSize(); renderGrid(); });
$("#dclose").addEventListener("click", closeDrawer);
// The format toolbar keeps the selection (mousedown does not take focus) and acts on the document right after it.
document.addEventListener("mousedown", (e) => { if (e.target.closest?.(".edbar button")) e.preventDefault(); });
document.addEventListener("click", (e) => {
  const b = e.target.closest?.(".edbar button[data-cmd]");
  if (!b) return;
  const sib = b.closest(".edbar").nextElementSibling, root = sib?.matches("#hsDoc") ? sib : sib?.querySelector("#trEdit");
  if (root) edCommand(root, b.dataset.cmd);
});
document.addEventListener("focusin", (e) => { const r = edRoot(e.target); if (r) histInit(r); });
document.addEventListener("keydown", (e) => {
  const er = (e.ctrlKey || e.metaKey) && !e.altKey && edRoot(e.target), k = er && e.key.toLowerCase();
  const cmd = k === "z" ? (e.shiftKey ? "redo" : "undo") : k === "y" ? "redo" : !e.shiftKey && { b: "bold", i: "italic", u: "underline" }[k];
  if (cmd) { e.preventDefault(); edCommand(er, cmd); return; }
  if (e.key === "Escape" && !$("#fpop").hidden) { closeFilter(); return; }
  if (e.key === "Enter" && e.target.id === "fval") { closeFilter(); return; }
  if (e.key === "Escape" && !$("#ov").hidden) { $("#ov").hidden = true; return; }
  if (e.key === "Escape" && (state.open || state.list)) closeDrawer();
});
// With a mouse a click on the dimmed page beside the tender details closes them, like Escape (Khoa, 2026-11-04); a phone
// shows the details full width, so there is nothing beside them to tap.
$("#scrim").addEventListener("click", () => { if ((state.open || state.list) && matchMedia("(hover: hover) and (pointer: fine)").matches) closeDrawer(); });
addEventListener("resize", closeFilter);

// ---------- Sync ----------
// The Windows bot (genbid-sync.js) syncs muasamcong; the page only asks for it (syncreq) and shows the answer.
const syncState = { note: null };

// ---------- Refresh ----------
// Only the newest tenders: Agent searches muasamcong but touches nothing older than the newest tender already stored.
async function syncNew() {
  if (state.readOnly || !state.db) return;
  const btn = $("#syncNewBtn"); btn.disabled = true;
  try { await saveRequests("syncreq", [{ key: "current", mode: "new" }]); syncState.note = null; }
  catch (e) { syncState.note = { kind: "err", text: "Không gửi được yêu cầu lấy gói mới: " + (e?.message || "lỗi không rõ") }; }
  finally { btn.disabled = false; btn.blur(); renderAll(); }
}
async function refreshAll() {
  const btn = $("#refreshBtn"); btn.disabled = true;
  try {
    if (state.db) {
      const snap = await state.db.doc("feed/current").get();
      state.feed = snap.exists ? snap.data() : state.feed;
      await rememberSeen();
    }
    capScan.done.clear();
    await requestMissingFiles();
    // Agent does the muasamcong sync; the banner says "Đang đồng bộ" until it answers.
    if (!state.readOnly && state.db) {
      try { await saveRequests("syncreq", [{ key: "current" }]); syncState.note = null; }
      catch (e) { syncState.note = { kind: "err", text: "Không gửi được yêu cầu đồng bộ: " + (e?.message || "lỗi không rõ") }; }
    }
    renderAll(); scanCapacities();
  } catch { toast("Không cập nhật được, hãy thử lại."); }
  finally { btn.disabled = false; }
}
document.addEventListener("keydown", (e) => { const k = e.target.closest?.("[data-kpi]"); if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openList(k.dataset.kpi); } const ks = e.target.closest?.("[data-kstat]"); if (ks && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openBidders(ks.dataset.kstat || null); } });

function renderAll() { renderTop(); renderGrid(); if (state.open) renderDrawer(false); }
// Bidding closes while the page is open: once a minute, move tenders whose deadline just passed to Đã đóng.
let closedSig = "";
setInterval(() => {
  if (!state.loaded.feed) return;
  const sig = allTenders().filter((t) => tabOf(t) === "closed").map((t) => t._key).join(",");
  if (closedSig && sig !== closedSig) { closedSig = sig; renderAll(); } else closedSig = sig;
}, 60000);
renderAll();
setInterval(() => { renderTop(); renderGrid(); }, 60000);
initDb();
openScreenFromUrl();
openTenderFromUrl();
openInvestorFromUrl();
})();
</script>
