<style>
/* Layout: one dense operations column (banner, KPI row, status tabs, tender grid) with a right-side drawer per tender. Dark-first, after the Incident Control Center. */
:root{
  --bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--line:#24304d;--rule:#3e4f78;--fg:#e6eaf5;--muted:#8d98b5;--dim:#5e6a88;
  --violet:#8b7cf6;--mint:#34d399;--amber:#fbbf24;--rose:#fb7185;--orange:#fb923c;--cyan:#22d3ee;--blue:#60a5fa;
  --violet-soft:rgba(139,124,246,.16);--mint-soft:rgba(52,211,153,.14);--rose-soft:rgba(251,113,133,.14);--amber-soft:rgba(251,191,36,.14);--cyan-soft:rgba(34,211,238,.12);
  --banner-a:#151d36;--banner-b:#0f1529;--wave:rgba(139,124,246,.35);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --green:var(--mint);--red:var(--rose);--yellow:var(--violet);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5fa;--panel:#ffffff;--panel2:#f0f2f9;--line:#dde1ee;--rule:#aab3cc;--fg:#141a2c;--muted:#5b6582;--dim:#8a93ad;
  --violet:#6d5ce8;--mint:#059669;--amber:#b7791f;--rose:#e11d48;--orange:#ea580c;--cyan:#0891b2;--blue:#2563eb;
  --violet-soft:rgba(109,92,232,.10);--mint-soft:rgba(5,150,105,.10);--rose-soft:rgba(225,29,72,.09);--amber-soft:rgba(183,121,31,.12);--cyan-soft:rgba(8,145,178,.10);
  --banner-a:#ffffff;--banner-b:#eef0fa;--wave:rgba(109,92,232,.28);
  --shadow:0 1px 2px rgba(20,26,44,.06),0 6px 18px rgba(20,26,44,.06);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f5fa;--panel:#ffffff;--panel2:#f0f2f9;--line:#dde1ee;--rule:#aab3cc;--fg:#141a2c;--muted:#5b6582;--dim:#8a93ad;
  --violet:#6d5ce8;--mint:#059669;--amber:#b7791f;--rose:#e11d48;--orange:#ea580c;--cyan:#0891b2;--blue:#2563eb;
  --violet-soft:rgba(109,92,232,.10);--mint-soft:rgba(5,150,105,.10);--rose-soft:rgba(225,29,72,.09);--amber-soft:rgba(183,121,31,.12);--cyan-soft:rgba(8,145,178,.10);
  --banner-a:#ffffff;--banner-b:#eef0fa;--wave:rgba(109,92,232,.28);
  --shadow:0 1px 2px rgba(20,26,44,.06),0 6px 18px rgba(20,26,44,.06);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-gutter:stable;overflow-y:scroll}
table.grid{table-layout:fixed}

body{color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
main{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
a{color:var(--violet)}
h1{font:600 24px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

h3{font:600 14px/1.3 var(--f-body);margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--rose)}
/* Read-only view for people not signed in to Claude: no controls that change data. */
.ro .stepbtns,.ro .selbox,.ro #bulkBar,.ro #refreshBtn,.ro [data-act],.ro #cmRun,.ro #cmSide,.ro #hsRun,.ro #bdRun,.ro #bdDrop,.ro #bdText,.ro #cmDrop,.ro #cmText,.ro #runQueueBtn{display:none!important}
.ro #dStage,.ro #dNote{pointer-events:none;opacity:.7}
.ro [data-viewtext],.ext [data-openpdf]{display:none!important}
.btn.green{background:var(--mint);border-color:var(--mint);color:#fff}
.bpline.none{color:var(--muted);font-weight:500}
.bpline .btn{margin-left:6px}
tr.us td{background:var(--cyan-soft)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;color:var(--fg)}
.ibtn svg{width:17px;height:17px}
input[type=search],input[type=text],input[type=datetime-local],input[type=url],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.5}
.note{border-left:3px solid var(--blue);background:var(--cyan-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.warn{border-color:var(--amber);background:var(--amber-soft)}
.note.err{border-color:var(--rose);background:var(--rose-soft)}

/* Banner */
.banner{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(120deg,var(--banner-a),var(--banner-b));box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* Banner accent: brand yellow instead of the app violet. */
.banner{--violet:#ffcc00;--violet-soft:rgba(255,204,0,.18);--wave:rgba(255,204,0,.4)}
.banner .mark{color:#1f1a00}
.banner svg.wave{position:absolute;right:0;top:0;height:100%;width:62%;pointer-events:none}
.mark{width:46px;height:46px;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.mark svg{width:28px;height:28px}
.btitle{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.btitle h1 span{color:var(--violet)}
.btitle .tag{color:var(--muted);font-size:13px}
.bmeta{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;flex-wrap:wrap}
/* Sync result: its own row at the bottom of the banner, right-aligned under the icons. */
.bnote{flex-basis:100%;position:relative;color:var(--muted);font-size:12.5px;line-height:1.45;display:flex;gap:8px;align-items:center;justify-content:flex-end;text-align:right;margin-top:-6px}
.bnote[hidden]{display:none}
.bnote.warn{color:var(--orange)}.bnote.err{color:var(--red)}
.bnote span{max-width:min(820px,75%)}
.bnote .ibtn{width:24px;height:24px;flex:none}
@media (max-width:640px){.bnote{justify-content:space-between;text-align:left;margin-top:0;padding-top:10px;border-top:1px dashed var(--line)}.bnote span{max-width:none}}
.syncline .spin{width:10px;height:10px}
.syncline{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syncline .ibtn{width:30px;height:30px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.dot.busy{background:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.spec{font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.04em}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;color:var(--fg)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--violet))}
.kpi .kl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .kv{font:600 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12px;color:var(--dim)}
.kpi{cursor:pointer}
.kpi:hover,.kpi.on{border-color:var(--kc)}
.kpi .kref{position:absolute;top:10px;right:10px;width:30px;height:30px}
.lrow{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;color:var(--fg)}
.lrow:hover{border-color:var(--violet)}

/* Status tabs */
.tabsbar{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--panel2);max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--violet-soft);color:var(--fg);font-weight:600}
.seg .c{font:600 11.5px var(--f-mono)}
.seg .c:not([class*="st-"]){color:var(--dim)}
.seg button[aria-selected="true"] .c:not([class*="st-"]){color:var(--violet)}

/* Grid */
.gridcard{padding:0;overflow:hidden}
.gridwrap{overflow-x:auto;scrollbar-width:none}
.gridwrap::-webkit-scrollbar{display:none}
.thc{display:flex;align-items:center;gap:4px}
.thsort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;white-space:nowrap;text-align:left}
.thsort:hover{color:var(--fg)}
.thf{border:0;background:none;padding:3px;border-radius:5px;color:var(--dim);display:inline-grid;place-items:center}
.thf svg{width:13px;height:13px}
.thf:hover{color:var(--fg);background:var(--panel2)}
.thf.on{color:var(--violet);background:var(--violet-soft)}
.fpop{position:fixed;z-index:60;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.fpop select,.fpop input{width:100%}
.tlink{text-decoration:none}
.tlink:hover{text-decoration:underline}
td.noc{min-width:170px}
td.locc{white-space:normal!important;min-width:90px;max-width:130px}
.aicon{width:26px;height:24px;border-radius:6px;display:inline-grid;place-items:center}
.aicon svg{width:14px;height:14px}
.aicon.ok{background:var(--mint-soft);color:var(--mint)}
.aicon.run{background:var(--violet-soft);color:var(--violet)}
.aicon.bad{background:var(--rose-soft);color:var(--rose)}
.aicon.mut{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.aline{margin-top:5px;display:flex}
.closed-at{color:var(--rose)!important}
.sbtn.win:hover{color:var(--mint);border-color:var(--mint)}
.sbtn.lose:hover{color:var(--rose);border-color:var(--rose)}
.sbtn.x:hover:not(:disabled){color:var(--rose);border-color:var(--rose)}
.pline{color:var(--mint);font-weight:600;margin-top:4px}
.bpline{color:var(--cyan);font-weight:600;margin-top:2px}
.stepbtns{display:flex;gap:4px;margin-top:5px}
.sbtn{width:26px;height:24px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;display:inline-grid;place-items:center;padding:0;color:var(--muted)}
.sbtn svg{width:14px;height:14px}
.sbtn:hover:not(:disabled){color:var(--fg);border-color:var(--violet)}
.sbtn:disabled{opacity:.35;cursor:default}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.pv{display:flex;flex-direction:column;gap:10px;align-items:center}
.pv canvas{width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:var(--shadow)}
.modal.wide{width:min(1040px,100%)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;background:var(--panel)}
table.grid{min-width:1060px;font-size:13px}
td.capc{white-space:normal!important;min-width:120px;max-width:190px}
table.grid th.sortable{cursor:pointer;user-select:none}
table.grid th.sortable:hover{color:var(--fg)}
table.grid th .arw{color:var(--violet);margin-left:4px}
table.grid .flt input,table.grid .flt select{width:100%;min-width:80px;font-size:12.5px;padding:4px 7px}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--panel2)}
table.grid tbody tr.open td{background:var(--violet-soft)}
table.grid td{white-space:nowrap}
table.grid tbody td{border-bottom:1px solid var(--rule)}
td.wrap{white-space:normal!important;min-width:260px;max-width:360px}
td.org{white-space:normal!important;min-width:190px;max-width:260px}
td.r{text-align:right}
.kcell{font:600 12.5px var(--f-mono)}
.src{font-size:11px;color:var(--dim)}
.cap{font:600 13px var(--f-mono);color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--mint-soft);color:var(--mint)}
.chip.bad{background:var(--rose-soft);color:var(--rose)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.run{background:var(--violet-soft);color:var(--violet)}
.chip.mut{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.tleft{font:600 11.5px var(--f-mono);margin-top:2px;color:var(--muted)}
.tleft.urgent{color:var(--orange)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--violet-soft);color:var(--violet);font-weight:600;border:1px solid transparent}
.stage{font-weight:600;font-size:12.5px}
.st-new{color:var(--cyan)}.st-reviewing{color:var(--blue)}.st-preparing{color:var(--violet)}.st-submitted{color:var(--amber)}.st-won{color:var(--mint)}.st-lost{color:var(--rose)}.st-dropped{color:var(--dim)}.st-closed{color:var(--rose)}
.scrollbtns{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px}
.scrollbtns .ibtn{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);width:36px;height:36px;opacity:.9}
.empty{color:var(--muted);padding:28px 16px;text-align:center}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}

/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(5,8,18,.45);z-index:45}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.25);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dhead .t h2{font-size:16px;overflow-wrap:anywhere}
.dtabs{padding:10px 16px 0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto}
.dtabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--violet)}
.dtabs button:disabled{opacity:.45;cursor:not-allowed}
.dbody{overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.kv{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.doclist{display:flex;flex-direction:column;gap:6px}
.docrow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex-wrap:wrap}
.docrow .fn{flex:1;min-width:160px;overflow-wrap:anywhere;font-size:13px}
.textview{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;max-height:55vh;overflow:auto;overflow-wrap:anywhere}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.drop.over{border-color:var(--violet)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel2);border-radius:6px;padding:5px 10px;min-width:0}
.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:16px}

/* Analysis and comparison blocks */
.sev{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.sev.critical{border-left-color:var(--rose)}.sev.warning{border-left-color:var(--amber)}.sev.info{border-left-color:var(--blue)}
.sev .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sev.critical .tag{color:var(--rose)}.sev.warning .tag{color:var(--amber)}.sev.info .tag{color:var(--blue)}
blockquote{margin:0;padding:5px 10px;border-left:2px solid var(--line);color:var(--muted);font-style:italic;font-size:13px}
.rec{font-size:13px}.rec b{color:var(--violet);font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tablewrap table{font-size:13px}
.tablewrap tr:last-child td{border-bottom:0}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details.sec{border-top:1px solid var(--line);padding-top:10px}
details.sec summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec summary::before{content:"+";font-family:var(--f-mono);color:var(--violet);width:14px}
details.sec[open] summary::before{content:"–"}

.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

<script>

Tender documents (E-HSMT / HSMT / HSYC) follow Vietnam's Law on Bidding (Luật Đấu thầu 22/2023/QH15) and Decree 24/2024/NĐ-CP and its circulars. You know the usual chapters: Chỉ dẫn nhà thầu (CDNT), Bảng dữ liệu đấu thầu (BDL), Tiêu chuẩn đánh giá (năng lực-kinh nghiệm, kỹ thuật, tài chính), Yêu cầu kỹ thuật, Biểu mẫu, Điều kiện hợp đồng.

  "highlights": [ { "severity": "critical"|"warning"|"info", "category": "deadline"|"eligibility"|"technical"|"financial"|"documents"|"contract"|"risk"|"other", "title": string, "detail": string, "quote": string|null (exact words from the document), "reference": string|null, "recommendation": string } ] (most severe first; critical = can disqualify the bid),
  "requiredDocuments": [string],

  "verdict": "pass"|"at_risk"|"fail" (pass = likely compliant, at_risk = fixable gaps, fail = disqualifying gaps),

  "items": [ { "category": "technical"|"qualification"|"financial"|"documents"|"commercial"|"other", "requirement": string, "requirementRef": string|null, "offered": string|null, "offeredRef": string|null, "status": "met"|"partial"|"not_met"|"missing"|"unclear", "critical": boolean, "note": string (why, with figures, and what to fix) } ],

}`;

// ---------- Formatting ----------
const TZ = "Asia/Ho_Chi_Minh";
function fmtDate(iso, withTime = true) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("vi-VN", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "numeric", ...(withTime ? { hour: "2-digit", minute: "2-digit" } : {}) });
}
// Banner sync time as "HH:mm MM/DD/YY" (the user's chosen format for the banner only).
function fmtBannerDate(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, month: "2-digit", day: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  return `${p.hour}:${p.minute} ${p.month}/${p.day}/${p.year}`;
}
function fmtVnd(n) {
  if (n == null || isNaN(n)) return "";
  if (n >= 1e9) return (n / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 2 }) + " tỷ đ";
  if (n >= 1e6) return (n / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " triệu đ";
  return n.toLocaleString("vi-VN") + " đ";
}
function timeLeft(iso) {
  if (!iso) return null;
  const ms = new Date(iso).getTime() - Date.now();
  if (!(ms > 0)) return null;
  const hrs = Math.floor(ms / 3.6e6), d = Math.floor(hrs / 24);
  return { text: d >= 1 ? `còn ${d} ngày ${hrs % 24} giờ` : `còn ${hrs} giờ ${Math.floor((ms % 3.6e6) / 6e4)} phút`, urgent: d < 3 };
}
const portalSearch = (notifyNo) => `https://muasamcong.mof.gov.vn/web/guest/contractor-selection?render=search&keyword=${encodeURIComponent(notifyNo)}`;
// Direct link to the Biên bản mở thầu tab, or with kq to the Kết quả lựa chọn nhà thầu tab once results are out, built from the ids the portal's search returns once bids are opened.
function minutesLink(t, kq = false) {
  const p = state.portalids?.[t._key];
  if (!p?.bidOpenId || (kq && !p.inputResultId)) return null;
  const P = "egpportalcontractorselectionv2_WAR_egpportalcontractorselectionv2";
  const q = { p_p_id: P, p_p_lifecycle: 0, p_p_state: "normal", p_p_mode: "view", [`_${P}_render`]: "detail-v2", type: "es-notify-contractor", stepCode: kq ? "notify-contractor-step-4-kqlcnt" : "notify-contractor-step-2-kqmt",
    id: p.id, notifyId: p.id, inputResultId: p.inputResultId || "undefined", bidOpenId: p.bidOpenId, techReqId: "undefined", bidPreNotifyResultId: "undefined", bidPreOpenId: "undefined",
    processApply: p.processApply, bidMode: p.bidMode, notifyNo: t.notifyNo, planNo: p.planNo, pno: "undefined", step: kq ? "kqlcnt" : "kqmt", isInternet: p.isInternet, caseKHKQ: "undefined", bidForm: p.bidForm };
  return "https://muasamcong.mof.gov.vn/web/guest/contractor-selection?" + Object.entries(q).map(([k, v]) => `${k}=${encodeURIComponent(v ?? "undefined")}`).join("&");
}
const tenderLink = (t) => t.sourceUrl || (t.notifyNo ? portalSearch(t.notifyNo) : "https://muasamcong.mof.gov.vn/web/guest/contractor-selection?render=index");
function toast(msg, ms = 2600) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status");
  document.body.appendChild(el);

}
const progress = (msg) => h`<div class="progress"><span class="spin"></span><span>${msg}</span></div>`;
const safeId = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 120) || "t" + Date.now();
const local = {
  get(k, d) { try { const v = localStorage.getItem("genbid:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("genbid:" + k, JSON.stringify(v)); } catch {} },
};

// ---------- State ----------
const state = {
  db: null, sample: undefined,
  feed: null, manual: {}, tracked: {}, hsmt: {}, analysis: {}, compare: {}, hsdt: {}, hsmtreq: {}, analysisreq: {}, bidders: {}, portalids: {}, deleted: {}, sel: new Set(), limit: pageSize(),

function sampleErrorText(e) {
  const c = e?.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled" || c === "not_declared") return "Trang này chưa được phép dùng AI. Đăng nhập rồi bấm Cho phép khi được hỏi.";
  if (c === "rate_limited") return "Đã chạm giới hạn sử dụng AI của tài khoản. Hãy thử lại sau ít phút.";
  if (c === "session_expired") return "Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.";

const noClaudeHtml = () => h`<div class="note warn">Không kết nối được AI ở chế độ xem này. Hãy đăng nhập rồi mở lại trang.</div>`;

// ---------- Document reading ----------
const MAX_TEXT = 170000; // bytes budget for document text in one call
if (window.pdfjsLib) { try { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch {} }

async function pdfToContent(file, imageBudget) {
  if (!window.pdfjsLib) throw new Error("Không tải được bộ đọc PDF.");
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = "";
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    let line = "", out = [];
    let lastY = null;
    for (const it of tc.items) {
      const y = it.transform?.[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ""; }
      line += it.str + (it.hasEOL ? "\n" : "");
      lastY = y;
    }
    out.push(line);
    text += `\n[Trang ${p}]\n` + out.join("\n").replace(/\n{3,}/g, "\n\n");
  }
  const images = [];
  // A scanned PDF has almost no text layer: send page pictures instead.
  if (text.replace(/\[Trang \d+\]|\s/g, "").length < 80 * doc.numPages && imageBudget > 0) {
    for (let p = 1; p <= Math.min(doc.numPages, imageBudget); p++) {
      const page = await doc.getPage(p);
      const vp = page.getViewport({ scale: 1.6 });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      images.push(await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.82)));
    }
    return { text: `(Tệp scan ${doc.numPages} trang; gửi kèm ảnh ${images.length} trang đầu)`, images, scanned: true, pages: doc.numPages };
  }
  return { text, images, pages: doc.numPages };
}
async function readFile(file, imageBudget) {
  const name = file.name.toLowerCase();
  if (file.type.startsWith("image/")) return { text: "", images: [file] };
  if (name.endsWith(".pdf")) return pdfToContent(file, imageBudget);
  if (name.endsWith(".docx")) {
    if (!window.mammoth) throw new Error("Không tải được bộ đọc DOCX.");
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value, images: [] };
  }
  if (name.endsWith(".doc")) throw new Error(`"${file.name}" là định dạng .doc cũ. Hãy lưu lại thành .docx hoặc PDF.`);
  return { text: await file.text(), images: [] };

      const lines = doc.splitTextToSize(String(s), W - indent), lh = size * 0.42;
      for (const ln of lines) { need(lh); doc.text(ln, M + indent, y + lh * 0.8); y += lh; }
      y += gap;
    };

    text(`${t?.bidName || ""}`, 10.5, false, 1);
    text(`Notice no. ${t?.notifyNo || "-"} · Bid closing ${fmtDate(t?.bidCloseDate) || "-"} · Source: muasamcong.mof.gov.vn`, 9, false, 5);
    for (const s of secs) {
      need(12); text(s.heading, 12, true, 1.5);
      for (const p of s.points || []) { need(6); doc.setFont("DejaVu", "normal"); doc.setFontSize(10); doc.text("•", M + 1, y + 3.4); text(p, 10, false, 1.2, 5); }
      y += 2;
    }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("DejaVu", "normal"); doc.setFontSize(8); doc.text(`GenBid Pro · ${t?.notifyNo || ""} · ${i}/${n}`, M, 297 - 8); }
    const ok = await saveFile(fileSafe(`${t?.notifyNo || "tender"} Technical requirements EN.pdf`), doc.output("blob"));
    info.textContent = ok ? "Đã tải PDF." : "";
  } catch (e) { info.textContent = e?.message || "Không tạo được PDF."; }
}

async function hsdtDocx(key) {

    const P = (text, opts = {}) => new Paragraph({ spacing: { after: 120 }, ...opts, children: [new TextRun({ text: String(text ?? ""), font: "Times New Roman", size: 26, ...(opts.run || {}) })] });
    const kids = [
      new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 120 }, children: [new TextRun({ text: "HỒ SƠ DỰ THẦU (BẢN THAM KHẢO)", bold: true, size: 32, font: "Times New Roman" })] }),
      P(t?.bidName || "", { alignment: AlignmentType.CENTER, run: { bold: true } }),

      P(r.summary || ""),

    for (const w of r.warnings || []) kids.push(P("Lưu ý: " + w, { run: { italics: true } }));
    for (const s of r.sections || []) {
      kids.push(new Paragraph({ heading: HeadingLevel.HEADING_1, spacing: { before: 240, after: 120 }, children: [new TextRun({ text: s.title, bold: true, font: "Times New Roman", size: 28 })] }));

      if (s.table?.rows?.length) {
        const cell = (x, bold) => new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: String(x ?? ""), bold, font: "Times New Roman", size: 22 })] })] });
        kids.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [new TableRow({ tableHeader: true, children: (s.table.headers || []).map((x) => cell(x, true)) }), ...s.table.rows.map((row) => new TableRow({ children: row.map((x) => cell(x)) }))] }));

    info.textContent = ok ? "Đã tải tệp Word." : "";

// One result card: "Mã TBMT : IB...-00", status, name, Bên mời thầu, Chủ đầu tư, posting date, field, place, closing time.
function parseResults(text) {
  const out = [];
  for (const blk of text.split(/Mã TBMT\s*:\s*/).slice(1)) {
    const m0 = blk.match(/^(IB\d+)-(\d+)/);
    if (!m0) continue;
    const lines = blk.split("\n").map((s) => s.trim()).filter(Boolean);
    const val = (label) => { const l = lines.find((x) => x.startsWith(label + " :")); return l ? l.slice(label.length + 2).trim() : null; };
    const st = lines.findIndex((l) => /^(Chưa|Đã) đóng thầu$/.test(l));
    const close = blk.match(/(?:Thời điểm đóng thầu|Thời điểm kết thúc chào giá trực tuyến)\s+(\d\d:\d\d)\s+(\d\d\/\d\d\/\d{4})/);
    const pub = blk.match(/(?:Ngày đăng tải thông báo|Thời gian sửa TBMT)\s*:\s*(\d\d\/\d\d\/\d{4})\s*-\s*(\d\d:\d\d)/);
    const loc = [...new Set(String(val("Địa điểm") || "").split(";").map((s) => s.split(" - ").pop().trim()).filter(Boolean))].join(", ");
    out.push({
      notifyNo: m0[1], notifyVersion: m0[2],
      bidName: (lines[st >= 0 ? st + 1 : 1] || "").replace(/\s+/g, " "),
      procuringEntityName: val("Bên mời thầu"), investorName: val("Chủ đầu tư"),
      publicDate: pub ? vnIso(pub[2], pub[1]) : null, bidCloseDate: close ? vnIso(close[1], close[2]) : null,
      field: FIELD_CODE[val("Lĩnh vực")] || val("Lĩnh vực"), location: loc || null,
      isInternet: !/Không qua mạng/.test(blk),
    });
  }
  return out;
}
// Known tenders get their closing time and notice version from the search; open ones missing from it stay; closed ones leave the feed (they stay in "seen").
function mergeFeed(found) {
  const cur = state.feed?.tenders || [];
  const byNo = new Map(found.map((f) => [f.notifyNo, f]));
  const next = [], changed = [], dropped = [], now = Date.now();
  for (const t of cur) {
    const f = byNo.get(t.notifyNo);
    if (f) {
      byNo.delete(t.notifyNo);
      const u = { ...t };
      if (f.bidCloseDate && f.bidCloseDate !== t.bidCloseDate) { if (!t.bidOpenDate || t.bidOpenDate === t.bidCloseDate) u.bidOpenDate = f.bidCloseDate; u.bidCloseDate = f.bidCloseDate; }
      if (f.notifyVersion && f.notifyVersion !== t.notifyVersion) { u.notifyVersion = f.notifyVersion; u.bidName = f.bidName || t.bidName; if (f.publicDate) u.publicDate = f.publicDate; }
      if (JSON.stringify(u) !== JSON.stringify(t)) changed.push(t.notifyNo);
      next.push(u);
    } else if (t.bidCloseDate && new Date(t.bidCloseDate).getTime() > now) next.push(t);
    else dropped.push(t.notifyNo);
  }
  return { next, fresh: [...byNo.values()], changed, dropped };
}

    const t2 = await pageText(m), i = t2.indexOf("STT");
    list = i >= 0 ? t2.slice(i, t2.indexOf("Thời điểm đóng thầu", i) > 0 ? t2.indexOf("Thời điểm đóng thầu", i) : undefined).trim() : "";
    const names = (await chapterLines(m)).map((l) => l.match(/generic "([^"]+)"/)?.[1]).filter(Boolean);
    for (const [k, name] of names.entries()) {
      syncStep(`Đang đọc ${name} của ${t.notifyNo}...`);
      // Refs change after every page load, so the chapter is found again by its name.
      if (k > 0 && !(await openHsmtTab(m, t))) break;
      const line = (await chapterLines(m)).find((l) => l.includes(`"${name}"`));
      if (!line) continue;
      const text = await readChapter(m, line);
      if (text) chapters.push({ name, text });
    }
  }
  const open = info.match(/Thời điểm mở thầu\s+(\d\d\/\d\d\/\d{4})\s+(\d\d:\d\d)/);
  const price = info.match(/Giá gói thầu\s+([\d.]+)\s*VND/);
  return { info, list, chapters, bidOpenDate: open ? vnIso(open[2], open[1]) : null, estimatedPrice: price ? +price[1].replace(/\./g, "") : null };
}
// Before the HSMT files arrive, Claude reads the public notice for a first brief; the full analysis replaces it once files come.
async function analyzeNotice(key, t, n) {
  const sample = await getSample();
  if (!sample || state.auto.blocked) return false;
  state.auto.current = key; renderAll();
  try {
    const prompt = `${DOMAIN}

Task: the attached HSMT files are not downloaded yet. From the public tender notice and the HSMT chapters published as web forms below (thông báo mời thầu: general information, bid security, validity, timing, the list of chapters and attached files; and, where present, Chương II Bảng dữ liệu, Chương III Tiêu chuẩn đánh giá, Chương V Yêu cầu kỹ thuật, Chương VII Điều kiện cụ thể của hợp đồng), write a preliminary brief for the bid team. Fill only what this text states; use null or empty lists for everything else. Add an "info" highlight naming what is only in the attached files and still has to be read (for example Chương V or Chương III when they are attachments). Flag deadlines, bid security and anything that can cause rejection as you would in a full analysis. ${langLine("vi")}

Answer with ONLY one JSON object, no prose and no code fence, in exactly this shape:
${ANALYSIS_SHAPE}

${tenderCtx(t)}--- Thông báo mời thầu trên muasamcong ---
${clip(n.info, 60000).text}

--- Danh mục hồ sơ mời thầu ---
${clip(n.list || "(không đọc được)", 20000).text}
${(n.chapters || []).map((c) => `\n--- ${c.name} (webform trên muasamcong) ---\n${clip(c.text, 40000).text}`).join("\n")}`;
    const a = await sample.json(prompt, { modelTier: "default" });
    const read = (n.chapters || []).map((c) => c.name).join(", ");
    const rec = { status: "done", basis: "notice", result: a, notes: [`Phân tích sơ bộ từ thông báo mời thầu${read ? " và các chương webform (" + read + ")" : ""} vì chưa có tệp HSMT đính kèm. AI sẽ tự phân tích lại đầy đủ khi tệp HSMT được tải về.`], analyzedAt: new Date().toISOString() };
    await dbSet("analysis/" + key, rec);
    state.analysis = { ...state.analysis, [key]: rec };
    return true;
  } catch (e) {
    if (e?.code === "not_granted" || e?.code === "sampling_disabled" || e?.code === "capability_disabled") state.auto.blocked = "consent";
    if (e?.code === "rate_limited") state.auto.blocked = "rate";
    return false;
  } finally { if (state.auto.current === key) state.auto.current = null; renderAll(); }
}
async function syncPortal(m) {
  const text = await searchPortal(m);
  const found = parseResults(text);
  if (!found.length && !/Tìm thấy\s+0\s+kết quả/.test(text)) throw new SyncStop("Không đọc được danh sách kết quả trên muasamcong. Anh thử bấm Refresh lại sau ít phút.");
  const total = +(text.match(/Tìm thấy\s+(\d+)\s+kết quả/)?.[1] || found.length);
  const { next, fresh, changed, dropped } = mergeFeed(found);
  const isNew = fresh.filter((f) => !state.deleted[safeId(f.notifyNo)]);
  // New tenders, plus open tenders in Mới that have neither HSMT files nor any analysis yet.
  const bare = next.filter((t) => { const k = safeId(t.notifyNo); return !state.deleted[k] && !isClosed(t) && stageOf({ ...t, _key: k }) === "new" && !state.hsmt[k]?.files?.length && !state.analysis[k]; });
  syncStep("Đang đọc liên kết các gói mới...");
  for (const f of isNew) {
    const l = await linkOf(m, f.notifyNo);
    if (!l) continue;
    const e = { bidCloseDate: f.bidCloseDate, bidForm: l.bidForm, bidMode: l.bidMode, bidName: f.bidName, bidOpenDate: f.bidCloseDate, estimatedPrice: null, field: f.field, id: l.id, investorName: f.investorName, isInternet: l.isInternet, location: f.location, notifyNo: f.notifyNo, notifyVersion: f.notifyVersion, planNo: l.planNo, processApply: l.processApply, publicDate: f.publicDate, sourceUrl: l.sourceUrl, status: "open" };
    if (f.procuringEntityName) e.procuringEntityName = f.procuringEntityName;
    next.push(e);
  }
  const saveFeed = async () => { const doc = { fetchedAt: new Date().toISOString(), source: "muasamcong", tenders: next }; if (await dbSet("feed/current", doc)) state.feed = doc; renderAll(); };
  const feedChanged = isNew.length || changed.length || dropped.length;
  if (feedChanged) await saveFeed();
  // Full notice details and a first analysis, a few tenders per sync.
  const todo = [...next.filter((t) => isNew.some((f) => f.notifyNo === t.notifyNo)), ...bare].slice(0, SYNC_DETAIL_MAX);
  let analysed = 0, detailsChanged = false;
  for (const [i, t] of todo.entries()) {
    const key = safeId(t.notifyNo);
    syncStep(`Đang đọc thông báo mời thầu ${t.notifyNo} (${i + 1}/${todo.length})...`);
    const n = await noticeOf(m, t);
    const e = next.find((x) => x.notifyNo === t.notifyNo);
    if (n.bidOpenDate && e.bidOpenDate !== n.bidOpenDate) { e.bidOpenDate = n.bidOpenDate; detailsChanged = true; }
    if (n.estimatedPrice && e.estimatedPrice == null) { e.estimatedPrice = n.estimatedPrice; detailsChanged = true; }
    await dbSet("notice/" + key, { notifyNo: t.notifyNo, info: n.info, hsmtList: n.list, chapters: n.chapters, at: new Date().toISOString() });
    // Ask the Windows worker for the HSMT files.
    if (!reqState(key)) { const rec = { notifyNo: t.notifyNo, sourceUrl: tenderLink(t), bidName: t.bidName || "", requestedAt: new Date().toISOString(), by: "sync" }; if (await dbSet("hsmtreq/" + key, rec)) state.hsmtreq = { ...state.hsmtreq, [key]: rec }; }
    syncStep(`AI đang phân tích sơ bộ ${t.notifyNo} (${i + 1}/${todo.length})...`);
    if (await analyzeNotice(key, { ...t, _key: key }, n)) analysed++;
  }
  if (detailsChanged) await saveFeed();
  const parts = [`${found.length}${total > found.length ? "/" + total : ""} gói đang mở`, `${isNew.length} gói mới`];
  if (changed.length) parts.push(`${changed.length} gói đổi thông tin (${changed.join(", ")})`);
  if (dropped.length) parts.push(`${dropped.length} gói đã đóng`);
  if (todo.length) parts.push(`đã đọc thông báo ${todo.length} gói, phân tích sơ bộ ${analysed} gói, đã gửi yêu cầu lấy tệp HSMT`);
  if (!feedChanged && !detailsChanged) parts.push("danh sách không đổi nên không ghi lại");
  return `Đồng bộ muasamcong xong: ${parts.join("; ")}.` + (total > found.length ? " Chỉ đọc 50 gói đầu tiên." : "");
}
function syncErrorText(e) {
  if (e instanceof SyncStop) return e.message;
  const c = e?.code;
  if (c === "cancelled" || c === "approval_required" || c === "not_in_manifest") return "GenBid Pro chưa được phép dùng trình duyệt của ứng dụng trên máy tính. Bấm Refresh lại và chọn Cho phép khi được hỏi.";
  if (c === "server_not_connected") return "Trình duyệt của ứng dụng trên máy tính không sẵn sàng. Mở GenBid Pro trong ứng dụng trên máy tính rồi bấm Refresh lại.";
  if (c === "tool_error") return "Trình duyệt báo lỗi khi đọc muasamcong: " + (e.message || "không rõ") + ".";
  return "Đồng bộ muasamcong bị gián đoạn (" + (c || e?.message || "lỗi không rõ") + "). Anh bấm Refresh lại sau ít phút.";
}

// ---------- Refresh ----------
async function refreshAll() {
  if (syncState.running) return;
  const btn = $("#refreshBtn"); btn.disabled = true;
  try {
    if (state.db) {
      const snap = await state.db.doc("feed/current").get();
      state.feed = snap.exists ? snap.data() : state.feed;
      await rememberSeen();
    }
    capScan.done.clear();
    state.auto.blocked = null; state.sample = undefined;
    const m = await hostBrowser();
    if (m) {
      syncState.running = true; syncState.note = null; renderAll();
      try { syncState.note = { kind: "", text: await syncPortal(m) }; await rememberSeen(); }
      catch (e) { syncState.note = { kind: e instanceof SyncStop ? "warn" : "err", text: syncErrorText(e) }; }
      finally { syncState.running = false; syncState.step = ""; }
    } else {
      await requestMissingFiles();
      // No browser here (web version, phone): Agent does the muasamcong sync; the banner says "Đang đồng bộ" until it answers.
      if (!state.readOnly && state.db) {
        try { await saveRequests("syncreq", [{ key: "current" }]); syncState.note = null; }
        catch (e) { syncState.note = { kind: "err", text: "Không gửi được yêu cầu đồng bộ: " + (e?.message || "lỗi không rõ") }; }
      }
    }
    renderAll(); scanCapacities(); scheduleAuto(300);
  } catch { toast("Không cập nhật được, hãy thử lại."); }
  finally { btn.disabled = false; }
}
document.addEventListener("keydown", (e) => { const k = e.target.closest?.("[data-kpi]"); if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openList(k.dataset.kpi); } });

// ---------- Theme ----------
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : !matchMedia("(prefers-color-scheme: light)").matches; };
function paintTheme() { $("#themeBtn").innerHTML = isDark() ? SUN : MOON; }
$("#themeBtn").addEventListener("click", () => { const n = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("genbid-theme", n); } catch {} paintTheme(); });

function renderAll() { renderTop(); renderGrid(); if (state.open) renderDrawer(false); }
// Bidding closes while the page is open: once a minute, move tenders whose deadline just passed to Đã đóng.
let closedSig = "";
setInterval(() => {
  if (!state.loaded.feed) return;
  const sig = allTenders().filter((t) => tabOf(t) === "closed").map((t) => t._key).join(",");
  if (closedSig && sig !== closedSig) { closedSig = sig; renderAll(); } else closedSig = sig;
}, 60000);
paintTheme();
renderAll();
setInterval(() => { renderTop(); renderGrid(); }, 60000);
initDb();
})();
